<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Астра — твоя AI-подруга</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: linear-gradient(135deg, #1b102d, #38204d, #171329);
    color: white;
    font-family: Arial, sans-serif;
    min-height: 100vh;
}

header {
    padding: 22px;
    text-align: center;
    font-size: 25px;
    color: #ffb5df;
    font-weight: bold;
}

.container {
    max-width: 1000px;
    margin: auto;
    padding: 15px;
    display: flex;
    flex-wrap: wrap;
    gap: 25px;
    justify-content: center;
}

.character {
    flex: 1;
    min-width: 280px;
    min-height: 430px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #ffffff0b;
    border: 1px solid #ffb5df44;
    border-radius: 25px;
    padding: 20px;
}

.avatar {
    width: 240px;
    height: 280px;
    position: relative;
    animation: float 3s infinite ease-in-out;
}

@keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
}

.hair {
    position: absolute;
    top: 10px;
    left: 20px;
    width: 200px;
    height: 230px;
    background: linear-gradient(135deg, #ff91ca, #ed4d9c);
    border-radius: 48% 48% 40% 40%;
    box-shadow: 0 0 35px #ff70b755;
}

.face {
    position: absolute;
    top: 55px;
    left: 43px;
    width: 155px;
    height: 170px;
    background: #ffe0d9;
    border-radius: 45% 45% 48% 48%;
    z-index: 2;
}

.bangs {
    position: absolute;
    top: 30px;
    left: 38px;
    width: 165px;
    height: 100px;
    background: #ff85bf;
    border-radius: 60% 60% 35% 35%;
    z-index: 3;
    clip-path: polygon(0 0,100% 0,100% 55%,80% 100%,65% 48%,48% 100%,30% 48%,15% 100%,0 65%);
}

.eye {
    position: absolute;
    top: 95px;
    width: 27px;
    height: 35px;
    background: linear-gradient(#76caff, #2877df);
    border-radius: 50%;
    border: 3px solid white;
    z-index: 4;
    animation: blink 4s infinite;
}

.eye.left { left: 33px; }
.eye.right { right: 33px; }

@keyframes blink {
    0%, 94%, 100% { transform: scaleY(1); }
    97% { transform: scaleY(0.1); }
}

.mouth {
    position: absolute;
    top: 145px;
    left: 69px;
    width: 18px;
    height: 10px;
    border-bottom: 3px solid #e86a8c;
    border-radius: 50%;
    z-index: 4;
}

.blush {
    position: absolute;
    top: 140px;
    width: 27px;
    height: 12px;
    background: #ff9baf;
    opacity: .6;
    filter: blur(5px);
    z-index: 4;
}

.blush.left { left: 15px; }
.blush.right { right: 15px; }

.character h2 {
    color: #ffb5df;
    margin-top: 10px;
}

.status {
    color: #a9f5c7;
    margin-top: 8px;
    font-size: 14px;
}

.chat {
    flex: 1;
    min-width: 280px;
    max-width: 450px;
    height: 430px;
    background: #ffffff0b;
    border: 1px solid #ffb5df44;
    border-radius: 25px;
    padding: 18px;
    display: flex;
    flex-direction: column;
}

.chat h2 {
    text-align: center;
    color: #ffb5df;
    margin-bottom: 15px;
}

.messages {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.message {
    padding: 12px;
    border-radius: 14px;
    max-width: 90%;
    line-height: 1.4;
    overflow-wrap: anywhere;
}

.bot {
    background: #9b5bb7;
    align-self: flex-start;
}

.user {
    background: #d94c9b;
    align-self: flex-end;
}

.controls {
    display: flex;
    gap: 8px;
    margin-top: 15px;
}

input {
    flex: 1;
    min-width: 0;
    padding: 13px;
    border: none;
    border-radius: 12px;
    background: #ffffff18;
    color: white;
    outline: none;
}

input::placeholder {
    color: #d5c3df;
}

button {
    border: none;
    border-radius: 12px;
    padding: 12px;
    background: #e96ab2;
    color: white;
    cursor: pointer;
    font-size: 16px;
}

button:hover {
    background: #ff8bc9;
}

.mic {
    margin-top: 10px;
    width: 100%;
    background: #8054b5;
}

footer {
    text-align: center;
    padding: 25px;
    color: #bda8d1;
    font-size: 13px;
}
</style>
</head>

<body>

<header>🌸 ASTRA AI 🌸</header>

<div class="container">

    <section class="character">

        <div class="avatar">
            <div class="hair"></div>
            <div class="face"></div>
            <div class="bangs"></div>

            <div class="eye left"></div>
            <div class="eye right"></div>

            <div class="blush left"></div>
            <div class="blush right"></div>

            <div class="mouth"></div>
        </div>

        <h2>Астра 💗</h2>
        <div class="status">● Готова к общению</div>

    </section>

    <section class="chat">

        <h2>Наш диалог 💬</h2>

        <div class="messages" id="messages">
            <div class="message bot">
                Привет! Я Астра! 🌸 Очень рада знакомству!
                Давай общаться!
            </div>
        </div>

        <div class="controls">
            <input id="input" placeholder="Напиши мне что-нибудь...">
            <button onclick="sendMessage()">➤</button>
        </div>

        <button class="mic" onclick="listen()">🎤 Говорить</button>

    </section>

</div>

<footer>
    Astra AI © 2026 · Твоя виртуальная помощница 🌸
</footer>

<script>
const messages = document.getElementById("messages");
const input = document.getElementById("input");

function addMessage(text, type) {
    const div = document.createElement("div");
    div.className = "message " + type;
    div.textContent = text;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
}

function speak(text) {
    if (!("speechSynthesis" in window)) return;

    speechSynthesis.cancel();

    const voice = new SpeechSynthesisUtterance(text);
    voice.lang = "ru-RU";
    voice.rate = 1;
    voice.pitch = 1.25;

    speechSynthesis.speak(voice);
}

function sendMessage() {
    const text = input.value.trim();

    if (!text) return;

    addMessage(text, "user");
    input.value = "";

    setTimeout(() => {
        const answer = "Я пока учусь общаться! 💗 Скоро у меня появится настоящий искусственный интеллект!";
        addMessage(answer, "bot");
        speak(answer);
    }, 500);
}

input.addEventListener("keydown", e => {
    if (e.key === "Enter") sendMessage();
});

function listen() {
    const Recognition = window.SpeechRecognition ||
                        window.webkitSpeechRecognition;

    if (!Recognition) {
        addMessage("Твой браузер не поддерживает распознавание речи.", "bot");
        return;
    }

    const recognition = new Recognition();
    recognition.lang = "ru-RU";
    recognition.start();

    recognition.onresult = event => {
        input.value = event.results[0][0].transcript;
        sendMessage();
    };

    recognition.onerror = () => {
        addMessage("Не удалось распознать речь. Попробуй ещё раз.", "bot");
    };
}
</script>

</body>
</html>
