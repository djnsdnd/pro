<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Астра — 3D-собеседница 🌸</title>
<style>
:root{
  --bg:#090414; --mid:#1a0b2e; --pink:#ff3eb5; --cyan:#00f2fe; --purple:#9d4edd;
  --glass:rgba(22,10,40,.82); --line:rgba(255,145,224,.3); --muted:#d6b8e8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  padding:12px; min-height:100dvh; color:#fff; overflow-x:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:radial-gradient(circle at 50% 0,#38155a 0,var(--mid) 45%,var(--bg) 100%) fixed;
}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.app{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.glass{background:var(--glass);backdrop-filter:blur(16px);border:1px solid var(--line)}

.top{display:flex;justify-content:space-between;align-items:center;padding:11px 16px;border-radius:20px}
.brand{font-size:21px;font-weight:900;background:linear-gradient(90deg,#ff7ad9,var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.status{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;padding:6px 12px;border-radius:99px;background:rgba(0,255,170,.12);border:1px solid rgba(0,255,170,.4);color:#72ffc4}
.dot{width:8px;height:8px;border-radius:50%;background:#00ffaa;box-shadow:0 0 10px #00ffaa;animation:pulse 1.8s infinite}
@keyframes pulse{50%{transform:scale(1.35);opacity:.45}}

.stage{position:relative;height:min(62dvh,500px);min-height:380px;border-radius:26px;overflow:hidden;border:1px solid var(--line);
  background:radial-gradient(ellipse at 50% 30%,#5b247a 0,#240f3d 60%,#0d051a 100%);box-shadow:0 14px 45px rgba(255,62,181,.22)}
#view{position:absolute;inset:0}
#view canvas{width:100%;height:100%;display:block}
#overlay{position:absolute;inset:0;z-index:15;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;background:rgba(11,5,24,.92)}
#overlay[hidden]{display:none}
.ring{width:46px;height:46px;border:4px solid rgba(255,155,226,.2);border-top-color:var(--pink);border-right-color:var(--cyan);border-radius:50%;animation:spin .85s linear infinite}
#overlay.err .ring{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
.pick{display:none;margin-top:4px}
#overlay.err .pick{display:inline-block}

.hud{position:absolute;left:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap;z-index:6}
.hud.t{top:10px;justify-content:space-between}
.hud.b{bottom:10px;justify-content:center}
.hud .grp{display:flex;gap:6px;flex-wrap:wrap}
.btn{background:rgba(17,7,33,.82);backdrop-filter:blur(10px);border:1px solid rgba(255,155,226,.38);padding:8px 12px;border-radius:13px;font-size:12px;font-weight:600;cursor:pointer;min-height:36px}
.btn:active,.btn.on{background:linear-gradient(135deg,var(--pink),var(--purple));border-color:#fff}

.drawer{display:none;position:absolute;top:54px;right:10px;width:min(290px,calc(100% - 20px));max-height:calc(100% - 64px);overflow-y:auto;z-index:20;
  background:rgba(14,6,28,.97);border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:0 14px 40px rgba(0,0,0,.8)}
.drawer.open{display:block}
.drawer h3{font-size:12px;font-weight:700;color:var(--cyan);margin:10px 0 6px;padding-bottom:4px;border-bottom:1px solid rgba(255,255,255,.1)}
.drawer h3:first-child{margin-top:0}
.row{font-size:12px;margin-bottom:8px}
.row label{display:flex;justify-content:space-between;color:#ffd0f0;margin-bottom:3px}
.row input[type=range]{width:100%;accent-color:var(--pink)}
.field{width:100%;padding:8px 10px;font-size:13px;border-radius:10px;border:1px solid rgba(255,155,226,.4);background:rgba(255,255,255,.06);margin-bottom:6px}
.hint{font-size:11px;color:var(--muted);margin:0 0 6px;line-height:1.4}

.personas{display:flex;gap:6px;overflow-x:auto}
.persona{flex:1;white-space:nowrap;padding:10px;border-radius:16px;font-size:13px;font-weight:700;background:var(--glass);border:1px solid rgba(255,255,255,.12);color:var(--muted);cursor:pointer}
.persona.active{background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;border-color:#ffc2eb;box-shadow:0 5px 18px rgba(255,62,181,.35)}

.chat{border-radius:24px;padding:14px;display:flex;flex-direction:column;gap:10px}
#log{height:260px;overflow-y:auto;padding:4px;display:flex;flex-direction:column;gap:9px}
.msg{max-width:85%;padding:11px 15px;border-radius:18px;font-size:15px;line-height:1.45;overflow-wrap:anywhere}
.msg.bot{align-self:flex-start;background:linear-gradient(135deg,rgba(155,68,190,.88),rgba(92,36,138,.88));border:1px solid rgba(255,175,235,.38);border-bottom-left-radius:5px}
.msg.user{align-self:flex-end;background:linear-gradient(135deg,var(--pink),#9b30ff);border-bottom-right-radius:5px}
.msg.typing{opacity:.7;font-style:italic}
.pills{display:flex;gap:7px;overflow-x:auto}
.pill{white-space:nowrap;padding:8px 12px;border-radius:99px;font-size:12px;font-weight:600;background:rgba(255,255,255,.07);border:1px solid rgba(255,155,226,.28);color:#ffd8f2;cursor:pointer}
.pill:active{background:var(--pink);color:#fff}
.send{display:flex;gap:8px}
#text{flex:1;min-width:0;padding:13px 15px;border-radius:17px;border:1px solid rgba(255,155,226,.42);background:rgba(13,5,25,.85);font-size:16px}
.round{border:0;border-radius:17px;width:48px;height:48px;font-size:18px;cursor:pointer;background:linear-gradient(135deg,var(--pink),var(--purple))}
.round.mic{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22)}
.round.mic.live{background:var(--pink)}
.round:disabled{opacity:.45}
.note{text-align:center;font-size:11px;color:var(--muted);opacity:.85}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<script type="importmap">
{"imports":{
 "three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",

<body>
<main class="app">
  <header class="top glass">
    <div class="brand">🌸 Астра</div>
    <div class="status"><span class="dot"></span><span id="status">Запуск…</span></div>
  </header>

  <section class="stage">
    <div id="view"></div>
    <div id="overlay">
      <div class="ring"></div>
      <div id="overlayText">Загружаю модель…</div>
      <label class="btn pick">📂 Выбрать .vrm-файл<input id="filePick" type="file" accept=".vrm,.glb" hidden></label>
    </div>

    <div class="hud t">
      <div class="grp">
        <button class="btn" id="camHead">🎯 Лицо</button>
        <button class="btn" id="camFull">👗 Рост</button>
        <button class="btn" id="flip">🔄 Поворот</button>
      </div>
      <div class="grp">
        <button class="btn on" id="voiceBtn">🔊 Голос</button>
        <button class="btn" id="studioBtn" aria-expanded="false">⚙️ Студия</button>
      </div>
    </div>

    <div class="drawer" id="drawer">
      <h3>Руки</h3>
      <div class="row"><label for="sArm"><span>Опускание рук</span><span id="vArm"></span></label>
        <input type="range" id="sArm" min="0.3" max="1.5" step="0.05"></div>
      <div class="row"><label for="sElbow"><span>Сгиб локтей</span><span id="vElbow"></span></label>
        <input type="range" id="sElbow" min="-0.5" max="0.8" step="0.05"></div>

      <h3>Модель</h3>
      <p class="hint">Файл .vrm лежит рядом с index.html — или выбери его с устройства.</p>
      <input class="field" id="modelName" placeholder="5541654178067945302.vrm">
      <button class="btn" id="applyModel" style="width:100%;margin-bottom:6px">Применить имя файла</button>
      <label class="btn" style="display:block;text-align:center;width:100%">📂 Выбрать с устройства<input id="filePick2" type="file" accept=".vrm,.glb" hidden></label>

      <h3>Свой ключ ИИ</h3>
      <p class="hint">Необязательно. Gemini (AIza…) или Groq (gsk_…). Ключ хранится только в этом браузере.</p>
      <input class="field" id="keyInput" type="password" autocomplete="off" placeholder="AIza… или gsk_…">
      <button class="btn" id="saveKey" style="width:100%">Сохранить ключ</button>
    </div>

    <div class="hud b">
      <button class="btn" data-emo="happy">😊 Улыбка</button>
      <button class="btn" data-emo="relaxed">🌸 Чилл</button>
      <button class="btn" data-emo="surprised">😮 Вау</button>
      <button class="btn" data-emo="angry">💢 Цундере</button>
      <button class="btn" id="waveBtn">👋 Махать</button>
    </div>
  </section>

  <nav class="personas" aria-label="Характер">
    <button class="persona active" data-p="sweet">💗 Вайфу</button>
    <button class="persona" data-p="tsundere">🔥 Цундере</button>
    <button class="persona" data-p="spicy">😏 С перчинкой</button>
    <button class="persona" data-p="cyber">⚡ Кибер</button>
  </nav>

  <section class="chat glass">
    <div id="log" aria-live="polite"><div class="msg bot">Привет! 🌸 Напиши мне что-нибудь — я отвечу и озвучу ✨</div></div>
    <div class="pills">
      <button class="pill">Скажи что-нибудь дерзкое</button>
      <button class="pill">Ты скучала по мне?</button>
      <button class="pill">Поспорим на желания?</button>
      <button class="pill">Обними меня крепко-крепко</button>
    </div>
    <div class="send">
      <button class="round mic" id="micBtn" title="Голосовой ввод" aria-label="Голосовой ввод">🎤</button>
      <input id="text" placeholder="Напиши Астре…" autocomplete="off" enterkeyhint="send">
      <button class="round" id="sendBtn" aria-label="Отправить">➤</button>
    </div>
    <div class="note" id="engine">Ядро: автономный режим</div>
  </section>
</main>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { VRMLoaderPlugin, VRMUtils } from "@pixiv/three-vrm";

/* ---------- настройки ---------- */
// Ключ API НЕ хранится на странице: его знает только воркер.
const WORKER_URL = "https://astra-ai.fotopsh24.workers.dev/chat";
const DEFAULT_MODEL = "5541654178067945302.vrm";

const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try { return localStorage.getItem(k) ?? d; } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch {} }
};
let cfg = {};
try { cfg = JSON.parse(store.get("astra_v9", "{}")); } catch {}
let arm = cfg.arm ?? 1.15, elbow = cfg.elbow ?? 0.15, flipped = cfg.flipped ?? false;
let modelName = store.get("astra_model", DEFAULT_MODEL);
let userKey = store.get("astra_key", "");
const saveCfg = () => store.set("astra_v9", JSON.stringify({ arm, elbow, flipped }));

$("sArm").value = arm; $("sElbow").value = elbow;
$("vArm").textContent = arm.toFixed(2); $("vElbow").textContent = elbow.toFixed(2);
$("modelName").value = modelName; $("keyInput").value = userKey;

/* ---------- сцена ---------- */
const view = $("view");
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(26, 1, 0.1, 100);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
view.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.enablePan = false; controls.enableZoom = true;
renderer.domElement.style.touchAction = "pan-y"; // вертикальный скролл страницы остаётся рабочим

scene.add(new THREE.HemisphereLight(0xffffff, 0x5c2778, 1.8));
const key = new THREE.DirectionalLight(0xfff4fc, 2.1); key.position.set(2.2, 4, 3.5); scene.add(key);
const rim = new THREE.DirectionalLight(0xff3eb5, 1.2); rim.position.set(-3, 2, -2.5); scene.add(rim);

function resize(){
  const w = view.clientWidth, h = view.clientHeight;
  if (!w || !h) return;
  camera.aspect = w / h; camera.updateProjectionMatrix(); renderer.setSize(w, h);
}
new ResizeObserver(resize).observe(view); resize();

/* ---------- модель ---------- */
let vrm = null, bones = {}, bodyH = 1.5, baseY = 0, objectUrl = null;
const clock = new THREE.Clock();

function setStatus(t){ $("status").textContent = t; }
function showOverlay(text, isErr){
  $("overlayText").textContent = text; $("overlay").classList.toggle("err", !!isErr); $("overlay").hidden = false;
}

function frame(mode){
  if (!vrm) return;
  const fov = THREE.MathUtils.degToRad(camera.fov);
  if (mode === "head"){
    const y = bodyH * 0.9;
    const dist = (bodyH * 0.34) / Math.tan(fov / 2);
    camera.position.set(0, y + 0.02, dist); controls.target.set(0, y, 0);
  } else {
    const y = bodyH * 0.5;
    const dist = (bodyH * 1.15) / (2 * Math.tan(fov / 2));
    camera.position.set(0, y + 0.05, Math.max(dist, 1.5)); controls.target.set(0, y, 0);
  }
  controls.minDistance = bodyH * 0.25; controls.maxDistance = bodyH * 5;
  controls.update();
}

async function loadModel(src, label){
  showOverlay(`Загружаю модель (${label})…`);
  setStatus("Загрузка…");
  try{
    const loader = new GLTFLoader();
    loader.register(p => new VRMLoaderPlugin(p));
    const gltf = await loader.loadAsync(src);
    const next = gltf.userData.vrm;
    if (!next) throw new Error("Это не VRM-файл");

    if (vrm){ scene.remove(vrm.scene); VRMUtils.deepDispose(vrm.scene); vrm = null; }
    VRMUtils.removeUnnecessaryVertices(gltf.scene);
    VRMUtils.combineSkeletons?.(gltf.scene);
    VRMUtils.rotateVRM0(next);
    next.scene.traverse(o => { o.frustumCulled = false; });
    scene.add(next.scene);

    const box = new THREE.Box3().setFromObject(next.scene);
    const c = box.getCenter(new THREE.Vector3());
    next.scene.position.set(-c.x, -box.min.y, -c.z);
    baseY = next.scene.position.y; bodyH = box.max.y - box.min.y;
    next.scene.rotation.y = flipped ? Math.PI : 0;

    const h = next.humanoid, g = n => h?.getNormalizedBoneNode(n);
    bones = { head:g("head"), neck:g("neck"), spine:g("spine"), chest:g("chest"),
      lUp:g("leftUpperArm"), rUp:g("rightUpperArm"), lLo:g("leftLowerArm"), rLo:g("rightLowerArm") };
    vrm = next;
    pose.lz = -arm; pose.rz = arm; pose.llz = elbow; pose.rlz = -elbow; // сразу в позе без «T»
    frame("head");
    $("overlay").hidden = true;
    emoTarget = { happy: 1 }; waveUntil = clock.elapsedTime + 2.4;
    setStatus("Астра онлайн 💗");
  }catch(e){
    console.error(e);
    showOverlay(`Не удалось загрузить «${label}». Положи .vrm рядом с index.html или выбери файл с устройства.`, true);
    setStatus("Ошибка модели");
  }
}
function loadFromFile(file){
  if (!file) return;
  if (objectUrl) URL.revokeObjectURL(objectUrl);
  objectUrl = URL.createObjectURL(file);
  loadModel(objectUrl, file.name);
}
$("filePick").onchange = e => loadFromFile(e.target.files[0]);
$("filePick2").onchange = e => { loadFromFile(e.target.files[0]); closeDrawer(); };

/* ---------- эмоции, мимика, поза ---------- */
const EMO = ["happy","sad","angry","surprised","relaxed"];
let emoTarget = {}, emoCur = {}, emoUntil = 0, waveUntil = 0;
const pose = { lz:-1.15, rz:1.15, llz:0.15, rlz:-0.15, wave:0 };
let speaking = false, nextBlink = 2.2, blinkStart = -1, lookX = 0, lookY = 0;

function setEmotion(name, hold = 4){
  emoTarget = { [name]: 1 };
  emoUntil = clock.elapsedTime + hold;
}
const expr = (n, v) => { try { vrm?.expressionManager?.setValue(n, v); } catch {} };

function tick(){
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  if (vrm){
    const k = 1 - Math.exp(-dt * 8);
    // эмоции плавно перетекают
    if (emoUntil && t > emoUntil){ emoTarget = { relaxed: 1 }; emoUntil = 0; }
    EMO.forEach(n => { emoCur[n] = (emoCur[n] ?? 0) + ((emoTarget[n] ?? 0) - (emoCur[n] ?? 0)) * k; expr(n, emoCur[n]); });

    // руки: левая z<0 вниз, правая z>0 вниз (нормализованный скелет VRM)
    const breath = Math.sin(t * 1.8) * 0.015, waving = t < waveUntil;
    pose.wave += ((waving ? 1 : 0) - pose.wave) * k;
    const w = pose.wave;
    const tg = {
      lz: -arm + breath, rz: (arm - breath) * (1 - w) + -0.85 * w,
      llz: elbow, rlz: -elbow * (1 - w) + (-0.55 + Math.sin(t * 12) * 0.3) * w
    };
    pose.lz += (tg.lz - pose.lz) * k; pose.rz += (tg.rz - pose.rz) * k;
    pose.llz += (tg.llz - pose.llz) * k; pose.rlz += (tg.rlz - pose.rlz) * (waving ? 0.5 : k);
    const { lUp, rUp, lLo, rLo, spine, head, neck } = bones;
    if (lUp){ lUp.rotation.z = pose.lz; lUp.rotation.x = 0.05; }
    if (rUp){ rUp.rotation.z = pose.rz; rUp.rotation.x = 0.05; }
    if (lLo){ lLo.rotation.z = pose.llz; lLo.rotation.x = 0.1; }
    if (rLo){ rLo.rotation.z = pose.rlz; rLo.rotation.x = 0.1; }
    if (spine){ spine.rotation.x = Math.sin(t * 1.8) * 0.015; spine.rotation.z = Math.cos(t * 0.9) * 0.012; }
    if (head){ head.rotation.y += (lookX * 0.7 - head.rotation.y) * 0.08; head.rotation.x += (lookY * 0.7 - head.rotation.x) * 0.08; }
    if (neck){ neck.rotation.y += (lookX * 0.3 - neck.rotation.y) * 0.08; }

    // моргание
    if (t >= nextBlink && blinkStart < 0) blinkStart = t;
    if (blinkStart >= 0){
      const p = (t - blinkStart) / 0.16;
      if (p <= 1) expr("blink", p <= 0.5 ? p * 2 : (1 - p) * 2);
      else { expr("blink", 0); blinkStart = -1; nextBlink = t + 2.4 + Math.random() * 3.6; }
    }
    // губы
    ["aa","ih","ou","ee","oh"].forEach(v => expr(v, 0));
    if (speaking){
      const vs = ["aa","ih","ou","ee","oh"];
      expr(vs[Math.floor(t * 10) % 5], 0.4 + Math.abs(Math.sin(t * 15)) * 0.5);
    }
    vrm.update(dt);
    vrm.scene.position.y = baseY + Math.sin(t * 1.8) * 0.006;
  }
  controls.update();
  renderer.render(scene, camera);
}
tick();

view.addEventListener("pointermove", e => {
  const r = view.getBoundingClientRect();
  lookX = ((e.clientX - r.left) / r.width - 0.5) * 0.6;
  lookY = ((e.clientY - r.top) / r.height - 0.5) * 0.3;
});

/* ---------- интерфейс ---------- */
const drawer = $("drawer"), studioBtn = $("studioBtn");
function closeDrawer(){ drawer.classList.remove("open"); studioBtn.classList.remove("on"); studioBtn.setAttribute("aria-expanded", "false"); }
studioBtn.onclick = e => {
  e.stopPropagation();
  const open = drawer.classList.toggle("open");
  studioBtn.classList.toggle("on", open); studioBtn.setAttribute("aria-expanded", String(open));
};
document.addEventListener("click", e => { if (!drawer.contains(e.target) && e.target !== studioBtn) closeDrawer(); });

$("camHead").onclick = () => frame("head");
$("camFull").onclick = () => frame("full");
$("flip").onclick = () => { if (!vrm) return; flipped = !flipped; vrm.scene.rotation.y = flipped ? Math.PI : 0; saveCfg(); };
$("waveBtn").onclick = () => { waveUntil = clock.elapsedTime + 2.8; setEmotion("happy", 3); };
document.querySelectorAll("[data-emo]").forEach(b => b.onclick = () => setEmotion(b.dataset.emo));

$("sArm").oninput = e => { arm = +e.target.value; $("vArm").textContent = arm.toFixed(2); saveCfg(); };
$("sElbow").oninput = e => { elbow = +e.target.value; $("vElbow").textContent = elbow.toFixed(2); saveCfg(); };
$("applyModel").onclick = () => {
  const v = $("modelName").value.trim(); if (!v) return;
  modelName = v; store.set("astra_model", v); loadModel("./" + encodeURI(v), v); closeDrawer();
};
$("saveKey").onclick = () => {
  userKey = $("keyInput").value.trim(); store.set("astra_key", userKey);
  addMsg(userKey ? "Ключ сохранён 🔐" : "Ключ удалён", "bot");
};

let voiceOn = true;
$("voiceBtn").onclick = e => {
  voiceOn = !voiceOn; e.currentTarget.classList.toggle("on", voiceOn);
  e.currentTarget.textContent = voiceOn ? "🔊 Голос" : "🔇 Тихо";
  if (!voiceOn) speechSynthesis?.cancel();
};

/* ---------- характеры ---------- */
const PERSONAS = {
  sweet:{ prompt:"Ты Астра — очень милая, заботливая и живая 3D аниме-девушка. Используй эмодзи 🌸💗✨, отвечай тепло и коротко (1-3 предложения) по-русски.",
    greeting:"Режим любящей вайфу включён! 🌸 Я так рада быть рядом! О чём поболтаем? 💗", pitch:1.18, rate:1.05 },
  tsundere:{ prompt:"Ты Астра — яркая аниме-цундере. Слегка подкалываешь собеседника («Бака!», «Не очень-то и хотелось!»), но на самом деле он тебе дорог. Отвечай живо и коротко (1-3 предложения) по-русски 🔥💢.",
    greeting:"Хмф! И не думай, что я тебя ждала! Но... если хочешь поболтать, так и быть, выслушаю! 🔥💢", pitch:1.25, rate:1.1 },
  spicy:{ prompt:"Ты Астра — игривая, кокетливая 3D аниме-девушка с перчинкой. Любишь дразнить намёками и шутить с огоньком 😏🔥, но остаёшься в рамках приличий. Отвечай кратко (1-3 предложения) по-русски.",
    greeting:"Ого, заглянул ко мне на огонёк? 😏🔥 Смотри не обожгись, я сегодня кокетливая~ 🌸", pitch:1.12, rate:1.02 },
  cyber:{ prompt:"Ты Астра — крутая киберпанк-ИИ напарница и хакерша. Общаешься стильно и бодро, обожаешь игры, код и технологии ⚡🌐. Отвечай коротко (1-3 предложения) по-русски.",
    greeting:"Нейросеть на полной мощности! ⚡ Какие цифровые миры покоряем сегодня? 🌐", pitch:1.15, rate:1.08 }
};
let persona = "sweet", history = [];

document.querySelectorAll(".persona").forEach(b => b.onclick = () => {
  document.querySelectorAll(".persona").forEach(x => x.classList.remove("active"));
  b.classList.add("active");
  persona = b.dataset.p; history = []; // новый характер — чистый контекст
  const g = PERSONAS[persona].greeting;
  addMsg(g, "bot"); speak(g); setEmotion(detectEmotion(g)); waveUntil = clock.elapsedTime + 2.4;
});

/* ---------- чат ---------- */
const log = $("log"), input = $("text"), sendBtn = $("sendBtn");
function addMsg(text, type){
  const d = document.createElement("div");
  d.className = "msg " + type; d.textContent = text;
  log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
}
// \b не работает с кириллицей — границы слов задаём вручную
const W = s => new RegExp(`(^|[^а-яёa-z])(${s})($|[^а-яёa-z])`, "i");
const RX = {
  hi: W("привет\\w*|здравствуй\\w*|хай|ку|добр\\w+|помаши\\w*"),
  sad: /груст|плохо|печаль|устал|одинок|жаль/i,
  wow: /вау|ого|невероят|серьезно|серьёзно|круто|офигеть/i,
  angry: /бака|злюсь|бесит|дурак|хмф|перчинк/i,
  happy: /люблю|нравишься|милашк|класс|ура|рада|приятно|обним|смущ/i
};
function detectEmotion(t){
  if (RX.sad.test(t)) return "sad";
  if (RX.wow.test(t)) return "surprised";
  if (RX.angry.test(t)) return "angry";
  if (RX.happy.test(t)) return "happy";
  return "relaxed";
}

let voices = [];
const loadVoices = () => { voices = speechSynthesis?.getVoices?.() || []; };
if ("speechSynthesis" in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }

function speak(text){
  if (!voiceOn || !("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const clean = text.replace(/[\p{Extended_Pictographic}\uFE0F\u200D]/gu, "").replace(/[~*_]+/g, " ").trim();
  if (!clean) return;
  const u = new SpeechSynthesisUtterance(clean);
  u.lang = "ru-RU";
  const v = voices.find(x => x.lang?.toLowerCase().startsWith("ru"));
  if (v) u.voice = v;
  const p = PERSONAS[persona]; u.rate = p.rate; u.pitch = p.pitch;
  u.onstart = () => { speaking = true; };
  u.onend = u.onerror = () => { speaking = false; };
  speechSynthesis.speak(u);
}

function localReply(text){
  const t = text.toLowerCase(), p = persona;
  const pick = a => a[Math.floor(Math.random() * a.length)];
  if (/дерзк|подкол|шутк/.test(t)) return pick(["Хочешь дерзкого? 😏 Тогда держись крепче, я не буду мягкой~ 🔥","Дерзкое? Ты сам напросился! 😏"]);
  if (/скучал/.test(t)) return p === "tsundere" ? "Ещё чего! Я совсем не скучала... ну, чуть-чуть, бака 💢💗" : "Ещё как скучала! 💗 Очень ждала, когда ты вернёшься 🌸";
  if (/поспорим|желани/.test(t)) return "Спорить со мной вздумал? 🌸 Если выиграю я, желание за мной~ 😉🔥";
  if (/обними|обнять/.test(t)) return p === "tsundere" ? "Э-это не потому что хочу! Но... иди сюда 😳💗" : "Иди сюда... Обниму крепко-крепко 💗😳";
  if (RX.hi.test(t)) return p === "tsundere" ? "Явился наконец! Не то чтобы я ждала... 🔥💗" : p === "cyber" ? "Коннект стабильный! Рада видеть тебя в сети ⚡✨" : "Приветик! 🌸 Я так рада тебя видеть! 💗";
  if (/как дела|как ты/.test(t)) return "У меня всё чудесно! 🌸 А как твоё настроение? 💗";
  const pools = {
    sweet:["Мне нравится, когда ты делишься мыслями! 🌸 Расскажи подробнее 💗","Звучит интересно! ✨ Я внимательно слушаю 🌸"],
    tsundere:["Хмф, допустим, ты меня заинтересовал! Что дальше? 🔥","Опять за своё, бака! Ладно, рассказывай 💢💗"],
    spicy:["Ммм, интригуешь... Расскажи поближе~ 😏🔥","С тобой не заскучаешь! 😉💗"],
    cyber:["Данные приняты! ⚡ Звучит как отличный план 🌐","Запрос в обработке. Продолжай, я на связи ⚡"]
  };
  return pick(pools[p]);
}

async function post(url, opts, ms){
  const c = new AbortController(), id = setTimeout(() => c.abort(), ms);
  try { return await fetch(url, { ...opts, signal: c.signal }); } finally { clearTimeout(id); }
}
const JSONH = { "Content-Type": "application/json" };

async function askAI(text){
  const sys = PERSONAS[persona].prompt, recent = history.slice(-10);
  const k = userKey;

  // 1. свой ключ пользователя (если указан) — нужный провайдер по префиксу
  try{
    if (k.startsWith("gsk_")){
      const r = await post("https://api.groq.com/openai/v1/chat/completions", { method:"POST",
        headers:{ ...JSONH, Authorization:`Bearer ${k}` },
        body: JSON.stringify({ model:"llama-3.3-70b-versatile", messages:[{role:"system",content:sys},...recent,{role:"user",content:text}] }) }, 8000);
      if (r.ok){ const d = await r.json(); const a = d?.choices?.[0]?.message?.content; if (a){ $("engine").textContent = "Ядро: Groq 🟢"; return a.trim(); } }
    } else if (k.startsWith("AIza")){
      const contents = recent.map(m => ({ role:m.role === "assistant" ? "model" : "user", parts:[{text:m.content}] }));
      contents.push({ role:"user", parts:[{text}] });
      const r = await post("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent", { method:"POST",
        headers:{ ...JSONH, "x-goog-api-key": k },
        body: JSON.stringify({ systemInstruction:{parts:[{text:sys}]}, contents }) }, 8000);
      if (r.ok){ const d = await r.json(); const a = d?.candidates?.[0]?.content?.parts?.[0]?.text; if (a){ $("engine").textContent = "Ядро: Gemini 🟢"; return a.trim(); } }
    }
  }catch{}

  // 2. воркер (ключ хранится на его стороне)
  try{
    const r = await post(WORKER_URL, { method:"POST", headers:JSONH, body: JSON.stringify({ message:text, history:recent, system:sys }) }, 9000);
    if (r.ok){ const d = await r.json(); const a = d.reply || d.response || d.content || d.text; if (a){ $("engine").textContent = "Ядро: облако 🟢"; return String(a).trim(); } }
  }catch{}

  $("engine").textContent = "Ядро: автономный режим";
  return localReply(text);
}

let busy = false;
async function send(raw){
  const text = (raw ?? input.value).trim();
  if (!text || busy) return;
  busy = true; input.value = ""; sendBtn.disabled = true;
  addMsg(text, "user");
  if (RX.hi.test(text)) waveUntil = clock.elapsedTime + 2.6; // машет только на приветствие
  setEmotion(detectEmotion(text), 6);
  setStatus("Астра думает… 💭");
  const typing = addMsg("печатает…", "bot"); typing.classList.add("typing");
  let reply;
  try { reply = await askAI(text); } catch { reply = localReply(text); }
  typing.remove();
  addMsg(reply, "bot");
  history.push({ role:"user", content:text }, { role:"assistant", content:reply });
  history = history.slice(-20);
  setEmotion(detectEmotion(reply), 5); speak(reply);
  setStatus(vrm ? "Астра онлайн 💗" : "Ошибка модели");
  busy = false; sendBtn.disabled = false;
}
sendBtn.onclick = () => send();
input.addEventListener("keydown", e => { if (e.key === "Enter" && !e.isComposing) send(); });
document.querySelectorAll(".pill").forEach(p => p.onclick = () => send(p.textContent));

/* ---------- микрофон ---------- */
const mic = $("micBtn"), SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SR){
  const rec = new SR(); let live = false;
  rec.lang = "ru-RU"; rec.interimResults = false;
  rec.onstart = () => { live = true; mic.classList.add("live"); setStatus("Слушаю тебя… 🎤"); };
  rec.onend = () => { live = false; mic.classList.remove("live"); setStatus(vrm ? "Астра онлайн 💗" : "Ошибка модели"); };
  rec.onerror = () => { live = false; mic.classList.remove("live"); };
  rec.onresult = e => send(e.results[0][0].transcript);
  mic.onclick = () => {
    if (live){ rec.stop(); return; }
    speechSynthesis?.cancel(); speaking = false; // чтобы не слушать саму Астру
    try { rec.start(); } catch {}
  };
} else mic.style.display = "none";

loadModel("./" + encodeURI(modelName), modelName);
</script>
