<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI ANIME WAIFU // Neural Companion Core</title>
    <style>
        :root {
            --bg-deep: #030408;
            --bg-glass: rgba(10, 14, 28, 0.65);
            --border-neon: rgba(255, 105, 180, 0.4);
            --neon-pink: #ff69b4;
            --neon-cyan: #00f2fe;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(255, 105, 180, 0.08) 0%, transparent 45%),
                radial-gradient(circle at 80% 80%, rgba(0, 242, 254, 0.08) 0%, transparent 45%);
        }

        /* Главный контейнер сетки */
        .app-container {
            display: grid;
            grid-template-columns: 1fr 420px;
            height: 100vh;
            padding: 24px;
            gap: 24px;
        }

        @media(max-width: 1000px) {
            .app-container { grid-template-columns: 1fr; overflow-y: auto; height: auto; }
        }

        /* Левая часть: Сцена с Аниме-моделью */
        .stage-container {
            background: var(--bg-glass);
            backdrop-filter: blur(25px);
            border: 1px solid var(--border-neon);
            border-radius: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 40px 100px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.1);
        }

        .stage-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .waifu-status {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
            font-weight: 800;
            letter-spacing: 1px;
            color: var(--neon-pink);
            background: rgba(255, 105, 180, 0.1);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255, 105, 180, 0.3);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--neon-pink);
            border- головые: 50%;
            border-radius: 50%;
            box-shadow: 0 0 12px var(--neon-pink);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.5; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* 3D / Аниме персонаж (Холст + Аватара) */
        .character-viewport {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Красивый голографический аватар аниме-девушки в стиле хай-тек */
        .anime-avatar-card {
            width: 280px;
            height: 380px;
            background: linear-gradient(135deg, rgba(255,105,180,0.15), rgba(0,242,254,0.05));
            border: 2px solid var(--neon-pink);
            border-radius: 140px 140px 40px 40px;
            box-shadow: 0 0 50px rgba(255,105,180,0.3), inset 0 0 30px rgba(255,105,180,0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            animation: floatAnime 4s ease-in-out infinite;
        }

        @keyframes floatAnime {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(1deg); }
        }

        .anime-face {
            font-size: 5rem;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 20px var(--neon-pink));
        }

        .speech-bubble {
            background: rgba(6, 9, 19, 0.85);
            border: 1px solid var(--border-neon);
            padding: 12px 20px;
            border-radius: 18px;
            font-size: 0.95rem;
            color: #fff;
            max-width: 240px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: absolute;
            bottom: -30px;
        }

        /* Правая панель: Нейро-Чат с Вайфу */
        .chat-container {
            background: var(--bg-glass);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 30px;
            display: flex;
            flex-direction: column;
            padding: 26px;
            box-shadow: 0 40px 100px rgba(0,0,0,0.8);
        }

        .chat-header {
            font-size: 1.1rem;
            font-weight: 900;
            margin-bottom: 20px;
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chat-stream {
            flex: 1;
            background: rgba(1, 2, 4, 0.6);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 18px;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 16px;
            font-size: 0.9rem;
        }

        .msg-waifu {
            background: rgba(255, 105, 180, 0.12);
            border: 1px solid rgba(255, 105, 180, 0.3);
            color: #fbcfe8;
            padding: 12px 16px;
            border-radius: 14px;
            align-self: flex-start;
            max-width: 90%;
            line-height: 1.5;
        }

        .msg-user {
            background: linear-gradient(135deg, var(--neon-pink), var(--neon-cyan));
            color: #030408;
            font-weight: 800;
            padding: 12px 16px;
            border-radius: 14px;
            align-self: flex-end;
            max-width: 90%;
        }

        .chat-input-row {
            display: flex;
            gap: 8px;
        }

        .chat-field {
            flex: 1;
            background: rgba(1, 2, 4, 0.8);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 14px 18px;
            border-radius: 14px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
            transition: 0.2s;
        }

        .chat-field:focus {
            border-color: var(--neon-pink);
            box-shadow: 0 0 0 3px rgba(255, 105, 180, 0.2);
        }

        .chat-send {
            background: linear-gradient(135deg, var(--neon-pink), var(--neon-cyan));
            color: #030408;
            border: none;
            padding: 0 20px;
            border-radius: 14px;
            font-weight: 900;
            cursor: pointer;
            transition: 0.2s;
        }

        .chat-send:hover { opacity: 0.9; transform: scale(1.02); }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- Левая сцена с аниме-вайфу -->
        <div class="stage-container">
            <div class="stage-header">
                <div class="waifu-status">
                    <div class="status-dot"></div>
                    AI CORE // ACTIVE
                </div>
                <div style="font-size: 0.8rem; color: var(--text-muted); font-weight: 700;">MODEL: ASTRA-CHAN v3.0</div>
            </div>

            <!-- Персонаж -->
            <div class="character-viewport">
                <div class="anime-avatar-card">
                    <div class="anime-face">🌸✨</div>
                    <div class="speech-bubble" id="waifuBubble">Привет, Сэмпай! Я готова общаться. 💕</div>
                </div>
            </div>

            <div style="text-align: center; color: var(--text-muted); font-size: 0.82rem;">
                Интерактивный нейро-компаньон с поддержкой голосовых эмоций и динамического ответа.
            </div>
        </div>

        <!-- Правая панель чата -->
        <div class="chat-container">
            <div class="chat-header">
                💬 Нейро-диалог с Вайфу
            </div>

            <div class="chat-stream" id="chatStream">
                <div class="msg-waifu">Привет-привет! Сэмпай, о чем поговорим сегодня? Можешь спросить меня о чем угодно! ✨</div>
            </div>

            <div class="chat-input-row">
                <input type="text" id="userInputField" class="chat-field" placeholder="Напиши сообщение аниме-девушке..." onkeypress="if(event.key==='Enter') sendWaifuMessage()">
                <button class="chat-send" onclick="sendWaifuMessage()">➤</button>
            </div>
        </div>

    </div>

    <script>
        async function sendWaifuMessage() {
            const input = document.getElementById('userInputField');
            const text = input.value.trim();
            if (!text) return;

            const stream = document.getElementById('chatStream');
            const bubble = document.getElementById('waifuBubble');

            stream.innerHTML += `<div class="msg-user">${text}</div>`;
            input.value = '';

            const loadId = 'load_' + Date.now();
            stream.innerHTML += `<div class="msg-waifu" id="${loadId}">Думает... (๑>◡<๑)</div>`;
            stream.scrollTop = stream.scrollHeight;

            try {
                // Запрос к живому ИИ с характером аниме-девушки
                const response = await fetch("https://text.pollinations.ai/", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        messages: [
                            { 
                                role: "system", 
                                content: "Ты — милая, умная и преданная аниме-девушка по имени Астра-чан, виртуальный ИИ-компаньон. Отвечай с теплотой, используя милые эмодзи (✨, 💕, (｡♥‿♥｡)), будь дружелюбной, поддерживающей и технологичной на русском языке." 
                            },
                            { role: "user", content: text }
                        ],
                        model: "openai"
                    })
                });

                const reply = await response.text();
                document.getElementById(loadId).remove();
                
                stream.innerHTML += `<div class="msg-waifu">${reply}</div>`;
                bubble.innerText = reply.length > 50 ? reply.substring(0, 47) + '...' : reply;
            } catch (e) {
                document.getElementById(loadId).remove();
                stream.innerHTML += `<div class="msg-waifu" style="color: #ff4757;">Ой, сэмпай, сеть моргнула... Попробуй еще раз! 🥺</div>`;
            }
            stream.scrollTop = stream.scrollHeight;
        }
    </script>
</body>
</html>
