<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANIME WAIFU AI // OpenAI Neural Companion</title>
    <style>
        :root {
            --bg-deep: #050208;
            --bg-panel: rgba(18, 10, 30, 0.8);
            --border-neon: rgba(255, 105, 180, 0.4);
            --neon-pink: #ff69b4;
            --neon-purple: #b19cd9;
            --neon-cyan: #00f2fe;
            --text-main: #f8fafc;
            --text-muted: #cbd5e1;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(255, 105, 180, 0.15) 0%, transparent 45%),
                radial-gradient(circle at 85% 80%, rgba(0, 242, 254, 0.1) 0%, transparent 45%);
            padding: 20px;
        }

        .workspace {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 420px;
            gap: 24px;
            height: calc(100vh - 40px);
        }

        @media(max-width: 950px) {
            .workspace { grid-template-columns: 1fr; height: auto; }
        }

        .panel {
            background: var(--bg-panel);
            backdrop-filter: blur(25px);
            border: 1px solid var(--border-neon);
            border-radius: 32px;
            padding: 30px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        .top-status {
            font-size: 0.8rem;
            font-weight: 800;
            color: var(--neon-pink);
            letter-spacing: 2px;
            background: rgba(255, 105, 180, 0.1);
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255, 105, 180, 0.3);
        }

        /* Аниме Аватар */
        .anime-stage {
            position: relative;
            width: 260px;
            height: 340px;
            background: linear-gradient(135deg, rgba(255,105,180,0.25), rgba(0,242,254,0.1));
            border: 2px solid var(--neon-pink);
            border-radius: 130px 130px 40px 40px;
            box-shadow: 0 0 50px rgba(255,105,180,0.4), inset 0 0 30px rgba(255,105,180,0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: floatWaifu 4s ease-in-out infinite;
        }

        @keyframes floatWaifu {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        .anime-face-art {
            font-size: 5.5rem;
            filter: drop-shadow(0 0 20px var(--neon-pink));
            margin-bottom: 10px;
        }

        .waifu-name-tag {
            background: rgba(255,105,180,0.25);
            border: 1px solid var(--neon-pink);
            color: #ffb6c1;
            padding: 4px 14px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 900;
            letter-spacing: 1px;
        }

        /* Микрофон */
        .mic-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            width: 100%;
        }

        .mic-btn {
            background: linear-gradient(135deg, var(--neon-pink), var(--neon-cyan));
            color: #050208;
            border: none;
            width: 75px;
            height: 75px;
            border-radius: 50%;
            font-size: 1.7rem;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(255,105,180,0.5);
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mic-btn:hover { transform: scale(1.08); }
        .mic-btn.listening { background: #ff4757; animation: pulseMic 1s infinite alternate; }

        @keyframes pulseMic {
            from { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0.8); }
            to { box-shadow: 0 0 0 20px rgba(255, 71, 87, 0); }
        }

        /* Чат лог справа */
        .chat-panel {
            background: var(--bg-panel);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 32px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            height: 100%;
            box-shadow: 0 30px 60px rgba(0,0,0,0.7);
        }

        .chat-stream {
            flex: 1;
            background: rgba(2, 4, 8, 0.6);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 20px;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 16px;
            font-size: 0.9rem;
        }

        .msg-waifu {
            background: rgba(255, 105, 180, 0.12);
            border: 1px solid rgba(255, 105, 180, 0.3);
            color: #ffd1dc;
            padding: 12px 16px;
            border-radius: 16px;
            align-self: flex-start;
            max-width: 90%;
            line-height: 1.5;
        }

        .msg-user {
            background: linear-gradient(135deg, var(--neon-pink), var(--neon-cyan));
            color: #050208;
            font-weight: 800;
            padding: 12px 16px;
            border-radius: 16px;
            align-self: flex-end;
            max-width: 90%;
        }

        .input-row { display: flex; gap: 10px; }
        .text-field {
            flex: 1;
            background: rgba(2, 4, 8, 0.8);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 14px 18px;
            border-radius: 16px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
        }
        .text-field:focus { border-color: var(--neon-pink); }
        .send-btn {
            background: var(--neon-pink);
            color: #050208;
            border: none;
            padding: 0 20px;
            border-radius: 16px;
            font-weight: 900;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="workspace">
        
        <!-- Левая колонка: Вайфу и голос -->
        <div class="panel">
            <div class="top-status">✨ OPENAI NEURAL CORE</div>

            <div class="anime-stage">
                <div class="anime-face-art">🌸💖</div>
                <div class="waifu-name-tag">АСТРА-ЧАН</div>
            </div>

            <div class="mic-container">
                <button class="mic-btn" id="micBtn" onclick="toggleVoice()">🎙️</button>
                <div style="font-size: 0.85rem; color: var(--text-muted);" id="micStatus">Нажми микрофон для разговора</div>
            </div>
        </div>

        <!-- Правая колонка: Чат -->
        <div class="chat-panel">
            <h3 style="font-size: 1.1rem; font-weight: 900; margin-bottom: 16px;">💬 Диалог с Астрой</h3>
            
            <div class="chat-stream" id="chatStream">
                <div class="msg-waifu">Привет-привет, Сэмпай! 💕 Я твоя аниме-подруга Астра, работающая на OpenAI. Напиши мне или скажи голосом! ✨</div>
            </div>

            <div class="input-row">
                <input type="text" id="userInput" class="text-field" placeholder="Спроси Астру о чем угодно..." onkeypress="if(event.key==='Enter') sendText()">
                <button class="send-btn" onclick="sendText()">➤</button>
            </div>
        </div>

    </div>

    <script>
        // Твой встроенный OpenAI ключ
        const OPENAI_API_KEY = "Sk-proj-1ysqdbcdSSIoQ_ergm7HRoImjq2-MYri7y8SGUFQUUfyZj62odOkndUo3cpzZiHgjRPE26yoydT3BlbkFJeGSbY77OmjHylpNpeYql6uAf7g-WdJKvE4qEFtOukhIJOXFZdKqVe_Vtmf6xTxUOqFUYc7kxgA";

        let isListening = false;
        let recognition = null;

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'ru-RU';
            recognition.onresult = (e) => {
                const text = e.results[0][0].transcript;
                processQuery(text);
                setListeningState(false);
            };
            recognition.onerror = () => setListeningState(false);
            recognition.onend = () => setListeningState(false);
        }

        function toggleVoice() {
            if (!recognition) {
                alert('Голосовой ввод не поддерживается вашим браузером.');
                return;
            }
            if (isListening) {
                recognition.stop();
                setListeningState(false);
            } else {
                recognition.start();
                setListeningState(true);
            }
        }

        function setListeningState(active) {
            isListening = active;
            const btn = document.getElementById('micBtn');
            const status = document.getElementById('micStatus');
            if(active) {
                btn.classList.add('listening');
                status.innerText = '🔴 Слушаю тебя, Сэмпай...';
            } else {
                btn.classList.remove('listening');
                status.innerText = 'Нажми микрофон для разговора';
            }
        }

        function sendText() {
            const field = document.getElementById('userInput');
            const text = field.value.trim();
            if(!text) return;
            field.value = '';
            processQuery(text);
        }

        async function processQuery(query) {
            const stream = document.getElementById('chatStream');
            stream.innerHTML += `<div class="msg-user">${query}</div>`;

            const loadId = 'load_' + Date.now();
            stream.innerHTML += `<div class="msg-waifu" id="${loadId}">Думает... (｡♥‿♥｡)</div>`;
            stream.scrollTop = stream.scrollHeight;

            try {
                // Прямой запрос к официальному API OpenAI
                const res = await fetch("https://api.openai.com/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${OPENAI_API_KEY}`
                    },
                    body: JSON.stringify({
                        model: "gpt-4o-mini",
                        messages: [
                            { 
                                role: "system", 
                                content: "Ты — Астра-чан, милая, умная и преданная аниме-девушка вайфу. Отвечай нежно, тепло, используя аниме-лексикон (сэмпай и т.д.), милые смайлики (💕, ✨, (๑>◡<๑)) и короткие реплики на русском языке." 
                            },
                            { role: "user", content: query }
                        ]
                    })
                });

                const data = await res.json();
                document.getElementById(loadId).remove();

                if (data.choices && data.choices.length > 0) {
                    const replyText = data.choices[0].message.content;
                    stream.innerHTML += `<div class="msg-waifu">${replyText}</div>`;
                    stream.scrollTop = stream.scrollHeight;
                    speakResponse(replyText);
                } else {
                    stream.innerHTML += `<div class="msg-waifu" style="color:#ff4757;">Ошибка API OpenAI. Проверьте правильность ключа! 🥺</div>`;
                }

            } catch (err) {
                document.getElementById(loadId).remove();
                stream.innerHTML += `<div class="msg-waifu" style="color:#ff4757;">Ошибка сети при обращении к OpenAI! 🥺</div>`;
            }
        }

        function speakResponse(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ru-RU';
            utterance.pitch = 1.3;
            utterance.rate = 1.1;
            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
