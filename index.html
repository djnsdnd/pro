<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Astra AI 🌸</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    color: white;
    background: linear-gradient(145deg, #180d2b, #422052, #241334);
}

header {
    text-align: center;
    color: #ff9bd5;
    font-size: 30px;
    font-weight: bold;
    margin: 15px 0 25px;
}

.container {
    max-width: 650px;
    margin: auto;
}

.card {
    border: 1px solid #9d69a8;
    border-radius: 25px;
    padding: 18px;
    margin-bottom: 22px;
    background: rgba(255,255,255,0.045);
}

#avatar3d {
    height: 440px;
    width: 100%;
    position: relative;
    overflow: hidden;
    border-radius: 18px;
    background: radial-gradient(ellipse, #61336e, #281638);
    touch-action: pan-y;
}

#avatar3d canvas {
    width: 100%;
    height: 100%;
    display: block;
}

#loading3d {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    color: #ffb5df;
    padding: 20px;
    z-index: 2;
}

h2 {
    color: #ffa4d9;
    text-align: center;
}

.status {
    text-align: center;
    color: #aaffc8;
    margin: 15px;
}

#messages {
    height: 300px;
    overflow-y: auto;
    padding: 10px;
}

.message {
    padding: 13px 16px;
    border-radius: 18px;
    margin: 10px 0;
    line-height: 1.5;
    overflow-wrap: anywhere;
}

.bot {
    background: #9652ad;
    margin-right: 25px;
}

.user {
    background: #55356f;
    margin-left: 25px;
    text-align: right;
}

.controls {
    display: flex;
    gap: 8px;
    margin-top: 12px;
}

input {
    flex: 1;
    min-width: 0;
    padding: 15px;
    border: 1px solid #bd80d1;
    border-radius: 15px;
    background: #291638;
    color: white;
    font-size: 16px;
}

button {
    border: none;
    border-radius: 15px;
    padding: 13px 17px;
    background: #d65cae;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:disabled {
    opacity: .5;
}

.small {
    color: #d5b7df;
    font-size: 12px;
    text-align: center;
    margin-top: 12px;
}

</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
    "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3/lib/three-vrm.module.min.js"
  }
}
</script>
</head>

<body>

<header>🌸 ASTRA AI 🌸</header>

<main class="container">

<section class="card">
    <div id="avatar3d">
        <div id="loading3d">Загружаю 3D-Астру... 🌸</div>
    </div>

    <h2>Астра 💗</h2>
    <div class="status" id="status">● Подключаюсь...</div>
</section>

<section class="card">
    <h2>Наш диалог 💬</h2>

    <div id="messages">
        <div class="message bot">
            Привет! Я Астра! 🌸 Рада тебя видеть!
        </div>
    </div>

    <div class="controls">
        <input id="userInput" placeholder="Напиши Астре..." autocomplete="off">
        <button id="sendButton">➤</button>
    </div>

    <div class="small">
        Astra AI • 3D Anime Assistant
    </div>
</section>

</main>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { VRMLoaderPlugin } from "@pixiv/three-vrm";

/* НАСТРОЙКИ */

const MODEL_URL = "./1544776736783819498.vrm";
const API_URL = "https://astra-ai.fotopsh24.workers.dev/chat";

const avatar = document.getElementById("avatar3d");
const loading = document.getElementById("loading3d");
const status = document.getElementById("status");

/* THREE.JS */

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
    30,
    avatar.clientWidth / avatar.clientHeight,
    0.1,
    100
);

camera.position.set(0, 1.35, 3.5);
camera.lookAt(0, 1.2, 0);

const renderer = new THREE.WebGLRenderer({
    antialias: true,
    alpha: true
});

renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(avatar.clientWidth, avatar.clientHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;

avatar.appendChild(renderer.domElement);

/* ОСВЕЩЕНИЕ */

scene.add(new THREE.HemisphereLight(0xffffff, 0x8b5a9e, 2));

const light = new THREE.DirectionalLight(0xffffff, 2.5);
light.position.set(2, 4, 5);
scene.add(light);

const pinkLight = new THREE.PointLight(0xff82cf, 2, 8);
pinkLight.position.set(-2, 2, 2);
scene.add(pinkLight);

/* ПЕРЕМЕННЫЕ */

let vrm = null;
let headBone = null;

let targetX = 0;
let targetY = 0;

const clock = new THREE.Clock();

/* ЗАГРУЗКА VRM */

async function loadAstra() {
    try {
        loading.textContent = "Загружаю модель... 🌸";

        const loader = new GLTFLoader();

        loader.register((parser) => {
            return new VRMLoaderPlugin(parser);
        });

        const gltf = await loader.loadAsync(MODEL_URL);

        vrm = gltf.userData.vrm;

        if (!vrm) {
            throw new Error("В файле не найдена VRM-модель.");
        }

        scene.add(vrm.scene);

        // Определяем размеры персонажа
        const box = new THREE.Box3().setFromObject(vrm.scene);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());

        // Центрируем персонажа
        vrm.scene.position.x -= center.x;
        vrm.scene.position.y -= box.min.y;
        vrm.scene.position.z -= center.z;

        // Подбираем масштаб камеры
        const height = Math.max(size.y, 1);
        camera.position.set(0, height * 0.85, height * 2.5);
        camera.lookAt(0, height * 0.55, 0);

        camera.far = height * 20;
        camera.updateProjectionMatrix();

        // Находим кость головы
        headBone = vrm.humanoid?.getNormalizedBoneNode("head");

        loading.style.display = "none";
        status.textContent = "● Астра готова к общению 💗";

    } catch (error) {
        console.error("Ошибка VRM:", error);

        loading.textContent =
            "Не удалось загрузить 3D-Астру. Проверь файл модели и подключение к интернету.";

        status.textContent = "● Ошибка загрузки модели";
    }
}

/* ДВИЖЕНИЕ ГОЛОВЫ */

function moveHead(event) {
    const rect = avatar.getBoundingClientRect();

    targetX = ((event.clientX - rect.left) / rect.width - 0.5) * 0.7;
    targetY = ((event.clientY - rect.top) / rect.height - 0.5) * 0.35;
}

avatar.addEventListener("pointermove", moveHead);

avatar.addEventListener("pointerleave", () => {
    targetX = 0;
    targetY = 0;
});

/* АНИМАЦИЯ */

function animate() {
    requestAnimationFrame(animate);

    const delta = Math.min(clock.getDelta(), 0.05);
    const elapsed = clock.elapsedTime;

    if (vrm) {
        vrm.update(delta);

        // Плавное движение головы
        if (headBone) {
            headBone.rotation.y +=
                (targetX - headBone.rotation.y) * 0.06;

            headBone.rotation.x +=
                (targetY - headBone.rotation.x) * 0.06;
        }

        // Лёгкое естественное движение модели
        vrm.scene.position.y =
            Math.sin(elapsed * 1.5) * 0.015;
    }

    renderer.render(scene, camera);
}

animate();

/* АДАПТАЦИЯ ПОД ТЕЛЕФОН */

window.addEventListener("resize", () => {
    const width = avatar.clientWidth;
    const height = avatar.clientHeight;

    camera.aspect = width / height;
    camera.updateProjectionMatrix();

    renderer.setSize(width, height);
});

loadAstra();

/* ЧАТ */

const messages = document.getElementById("messages");
const input = document.getElementById("userInput");
const sendButton = document.getElementById("sendButton");

let history = [];

function addMessage(text, type) {
    const element = document.createElement("div");

    element.className = "message " + type;
    element.textContent = text;

    messages.appendChild(element);
    messages.scrollTop = messages.scrollHeight;
}

async function sendMessage() {
    const message = input.value.trim();

    if (!message) return;

    input.value = "";
    addMessage(message, "user");

    sendButton.disabled = true;
    status.textContent = "● Астра думает...";

    try {
        const response = await fetch(API_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                message: message,
                history: history
            })
        });

        if (!response.ok) {
            throw new Error("Ошибка сервера: " + response.status);
        }

        const data = await response.json();

        if (!data.reply) {
            throw new Error("Сервер не вернул ответ.");
        }

        addMessage(data.reply, "bot");

        history.push(
            { role: "user", content: message },
            { role: "assistant", content: data.reply }
        );

        history = history.slice(-20);

        status.textContent = "● Астра готова к общению 💗";

        // Озвучивание ответа
        if ("speechSynthesis" in window) {
            speechSynthesis.cancel();

            const speech = new SpeechSynthesisUtterance(data.reply);
            speech.lang = "ru-RU";
            speech.rate = 1;

            speechSynthesis.speak(speech);
        }

    } catch (error) {
        console.error(error);

        addMessage(
            "Не получилось подключиться к моему ИИ. Попробуй ещё раз.",
            "bot"
        );

        status.textContent = "● Ошибка соединения";
    }

    sendButton.disabled = false;
}

sendButton.addEventListener("click", sendMessage);

input.addEventListener("keydown", (event) => {
    if (event.key === "Enter") {
        sendMessage();
    }
});
</script>

</body>
</html>
