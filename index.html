<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEURAL WAIFU // Voice & Vision Core</title>
    <style>
        :root {
            --bg-deep: #020408;
            --bg-panel: rgba(8, 12, 26, 0.75);
            --border-neon: rgba(0, 242, 254, 0.4);
            --neon-pink: #ff2a85;
            --neon-cyan: #00f2fe;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(255, 42, 133, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0, 242, 254, 0.1) 0%, transparent 40%),
                linear-gradient(rgba(255,255,255,0.01) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 40px 40px;
        }

        .workspace {
            display: grid;
            grid-template-columns: 1fr 450px;
            height: 100vh;
            padding: 20px;
            gap: 20px;
        }

        @media(max-width: 1000px) {
            .workspace { grid-template-columns: 1fr; overflow-y: auto; height: auto; }
        }

        /* Центр: Интерактивная аниме-вайфу с голосовым пультом */
        .avatar-section {
            background: var(--bg-panel);
            backdrop-filter: blur(30px);
            border: 1px solid var(--border-neon);
            border-radius: 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 40px;
            position: relative;
            box-shadow: 0 40px 100px rgba(0,0,0,0.8);
        }

        .top-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 242, 254, 0.08);
            border: 1px solid var(--border-neon);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: var(--neon-cyan);
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background: var(--neon-cyan);
            border-radius: 50%;
            box-shadow: 0 0 12px var(--neon-cyan);
            animation: glowPulse 1.5s infinite;
        }

        @keyframes glowPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.4; }
        }

        /* Футуристичный аватар */
        .hologram-stage {
            position: relative;
            width: 320px;
            height: 320px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ring {
            position: absolute;
            border-radius: 50%;
            border: 2px dashed rgba(0, 242, 254, 0.3);
            animation: spinRing 20s linear infinite;
        }
        .ring-1 { width: 300px; height: 300px; border-color: rgba(0, 242, 254, 0.2); }
        .ring-2 { width: 250px; height: 250px; border-color: rgba(255, 42, 133, 0.3); animation-direction: reverse; animation-duration: 15s; }

        @keyframes spinRing {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .waifu-core {
            width: 180px;
            height: 180px;
            background: linear-gradient(135deg, rgba(255, 42, 133, 0.2), rgba(0, 242, 254, 0.2));
            border: 2px solid var(--neon-cyan);
            border-radius: 50%;
            box-shadow: 0 0 50px rgba(0, 242, 254, 0.4), inset 0 0 30px rgba(255, 42, 133, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2;
            transition: 0.3s;
        }

        .waifu-core.speaking {
            border-color: var(--neon-pink);
            box-shadow: 0 0 70px var(--neon-pink), inset 0 0 40px var(--neon-pink);
            transform: scale(1.05);
        }

        .waifu-avatar-img {
            font-size: 4rem;
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.6));
        }

        /* Кнопка голосового вызова */
        .voice-control-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
        }

        .mic-btn {
            background: linear-gradient(135deg, var(--neon-pink), var(--neon-cyan));
            color: #020408;
            border: none;
            width: 75px;
            height: 75px;
            border-radius: 50%;
            font-size: 1.8rem;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0, 242, 254, 0.4);
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mic-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 15px 40px rgba(255, 42, 133, 0.6);
        }

        .mic-btn.listening {
            background: #ff4757;
            animation: micPulse 1s infinite alternate;
        }

        @keyframes micPulse {
            from { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0.7); }
            to { box-shadow: 0 0 0 20px rgba(255, 71, 87, 0); }
        }

        .voice-status-text {
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 700;
        }

        /* Правая панель: Лог диалога */
        .chat-section {
            background: var(--bg-panel);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 32px;
            display: flex;
            flex-direction: column;
            padding: 24px;
            box-shadow: 0 40px 100px rgba(0,0,0,0.8);
        }

        .chat-title {
            font-size: 1.1rem;
            font-weight: 900;
            margin-bottom: 20px;
            letter-spacing: -0.3px;
        }

        .transcript-stream {
            flex: 1;
            background: rgba(2, 4, 8, 0.6);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 20px;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 16px;
            font-size: 0.9rem;
        }

        .msg-waifu {
            background: rgba(0, 242, 254, 0.1);
            border: 1px solid rgba(0, 242, 254, 0.3);
            color: #c8f3fa;
            padding: 12px 16px;
            border-radius: 16px;
            align-self: flex-start;
            max-width: 90%;
            line-height: 1.5;
        }

        .msg-user {
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-pink));
            color: #020408;
            font-weight: 800;
            padding: 12px 16px;
            border-radius: 16px;
            align-self: flex-end;
            max-width: 90%;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        .text-input {
            flex: 1;
            background: rgba(2, 4, 8, 0.8);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 14px 18px;
            border-radius: 16px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
            transition: 0.2s;
        }

        .text-input:focus { border-color: var(--neon-cyan); }

        .send-btn {
            background: var(--neon-cyan);
            color: #020408;
            border: none;
            padding: 0 20px;
            border-radius: 16px;
            font-weight: 900;
            cursor: pointer;
            transition: 0.2s;
        }
        .send-btn:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <div class="workspace">
        
        <!-- Левая зона: Аватар и голосовое управление -->
        <div class="avatar-section">
            <div class="top-badge">
                <div class="pulse-dot"></div>
                VOICE NEURAL CORE v4.0
            </div>

            <!-- Голографический центр -->
            <div class="hologram-stage">
                <div class="ring ring-1"></div>
                <div class="ring ring-2"></div>
                <div class="waifu-core" id="waifuCoreNode">
                    <div class="waifu-avatar-img">🤖✨</div>
                </div>
            </div>

            <!-- Микрофон и голосовой ввод -->
            <div class="voice-control-box">
                <button class="mic-btn" id="micButtonToggle" onclick="toggleVoiceListening()" title="Нажми и говори">🎙️</button>
                <div class="voice-status-text" id="voiceStatusLabel">Нажми на микрофон, чтобы начать говорить</div>
            </div>
        </div>

        <!-- Правая зона: Лог чата -->
        <div class="chat-section">
            <div class="chat-title">💬 Текстовый и голосовой лог</div>
            
            <div class="transcript-stream" id="chatStreamBox">
                <div class="msg-waifu">Привет! Я твоя улучшенная нейро-подруга. Нажми на микрофон слева и скажи мне что-нибудь голосом, или напиши в чат! ✨</div>
            </div>

            <div class="input-row">
                <input type="text" id="textInputField" class="text-input" placeholder="Или напиши текст..." onkeypress="if(event.key==='Enter') sendTextMessage()">
                <button class="send-btn" onclick="sendTextMessage()">➤</button>
            </div>
        </div>

    </div>

    <script>
        let isListening = false;
        let recognition = null;

        // Инициализация распознавания речи (Speech-to-Text)
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'ru-RU';
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onresult = function(event) {
                const speechText = event.results[0][0].transcript;
                processUserQuery(speechText);
                stopListeningState();
            };

            recognition.onerror = function() {
                stopListeningState();
            };

            recognition.onend = function() {
                stopListeningState();
            };
        }

        function toggleVoiceListening() {
            if (!recognition) {
                alert('Ваш браузер не поддерживает голосовой ввод. Используйте текстовый чат!');
                return;
            }

            if (isListening) {
                recognition.stop();
                stopListeningState();
            } else {
                try {
                    recognition.start();
                    startListeningState();
                } catch (e) {
                    console.error(e);
                }
            }
        }

        function startListeningState() {
            isListening = true;
            const btn = document.getElementById('micButtonToggle');
            const label = document.getElementById('voiceStatusLabel');
            btn.classList.add('listening');
            label.innerText = '🔴 Слушаю тебя... Говори!';
        }

        function stopListeningState() {
            isListening = false;
            const btn = document.getElementById('micButtonToggle');
            const label = document.getElementById('voiceStatusLabel');
            btn.classList.remove('listening');
            label.innerText = 'Нажми на микрофон, чтобы начать говорить';
        }

        function sendTextMessage() {
            const field = document.getElementById('textInputField');
            const text = field.value.trim();
            if (!text) return;
            field.value = '';
            processUserQuery(text);
        }

        // Основная логика отправки запроса в нейросеть и озвучки голосом
        async function processUserQuery(userText) {
            const stream = document.getElementById('chatStreamBox');
            const coreNode = document.getElementById('waifuCoreNode');

            stream.innerHTML += `<div class="msg-user">${userText}</div>`;
            
            const loadId = 'load_' + Date.now();
            stream.innerHTML += `<div class="msg-waifu" id="${loadId}">Думаю над ответом... (｡♥‿♥｡)</div>`;
            stream.scrollTop = stream.scrollHeight;

            try {
                const res = "https://text.pollinations.ai/";
                const response = await fetch(res, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        messages: [
                            { role: "system", content: "Ты — умная, футуристичная и очень дружелюбная аниме-девушка ИИ-ассистент по имени Астра. Отвечай кратко (до 2-3 предложений), чтобы твой ответ было удобно слушать голосом, используя милые эмодзи и теплый тон на русском языке." },
                            { role: "user", content: userText }
                        ],
                        model: "openai"
                    })
                });

                const replyText = await response.text();
                document.getElementById(loadId).remove();
                stream.innerHTML += `<div class="msg-waifu">${replyText}</div>`;
                stream.scrollTop = stream.scrollHeight;

                // Озвучиваем ответ голосом (Text-to-Speech)
                speakWithVoice(replyText, coreNode);

            } catch (err) {
                document.getElementById(loadId).remove();
                stream.innerHTML += `<div class="msg-waifu" style="color:#ff4757;">Ой, что-то пошло не так с нейро-ядром! 🥺</div>`;
            }
        }

        // Функция озвучки текста голосом браузера с анимацией свечения ядра
        function speakWithVoice(text, coreNode) {
            if (!('speechSynthesis' in window)) return;

            window.speechSynthesis.cancel(); // Останавливаем предыдущую речь
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ru-RU';
            utterance.rate = 1.05; // Чуть бодрее темп
            utterance.pitch = 1.2; // Чуть повыше тон для аниме-вайба

            utterance.onstart = () => {
                coreNode.classList.add('speaking');
            };

            utterance.onend = () => {
                coreNode.classList.remove('speaking');
            };

            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
