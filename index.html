<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Астра — AI Assistant</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: linear-gradient(135deg, #1b102d, #38204d, #171329);
    color: white;
    font-family: Arial, sans-serif;
    min-height: 100vh;
}

header {
    padding: 22px;
    text-align: center;
    font-size: 27px;
    color: #ffb5df;
    font-weight: bold;
}

.container {
    max-width: 1050px;
    margin: auto;
    padding: 15px;
    display: flex;
    flex-wrap: wrap;
    gap: 25px;
    justify-content: center;
}

.character {
    flex: 1;
    min-width: 280px;
    min-height: 450px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #ffffff0b;
    border: 1px solid #ffb5df44;
    border-radius: 25px;
    padding: 20px;
}

#avatar3d {
    width: 100%;
    height: 390px;
    position: relative;
    overflow: hidden;
    border-radius: 20px;
    touch-action: pan-y;
}

#avatar3d canvas {
    width: 100%;
    height: 100%;
    display: block;
}

#loading3d {
    position: absolute;
    top: 50%;
    left: 0;
    width: 100%;
    text-align: center;
    color: #ffb5df;
    transform: translateY(-50%);
    z-index: 2;
}

.character h2 {
    color: #ffb5df;
    margin-top: 10px;
}

.status {
    color: #a9f5c7;
    margin-top: 8px;
    font-size: 14px;
}

.chat {
    flex: 1;
    min-width: 280px;
    max-width: 450px;
    height: 450px;
    background: #ffffff0b;
    border: 1px solid #ffb5df44;
    border-radius: 25px;
    padding: 18px;
    display: flex;
    flex-direction: column;
}

.chat h2 {
    text-align: center;
    color: #ffb5df;
    margin-bottom: 15px;
}

.messages {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.message {
    padding: 12px;
    border-radius: 14px;
    max-width: 90%;
    line-height: 1.4;
    overflow-wrap: anywhere;
}

.bot {
    background: #9b5bb7;
    align-self: flex-start;
}

.user {
    background: #d94c9b;
    align-self: flex-end;
}

.controls {
    display: flex;
    gap: 8px;
    margin-top: 15px;
}

input {
    flex: 1;
    min-width: 0;
    padding: 13px;
    border: none;
    border-radius: 12px;
    background: #ffffff18;
    color: white;
    outline: none;
    font-size: 16px;
}

input::placeholder {
    color: #d5c3df;
}

button {
    border: none;
    border-radius: 12px;
    padding: 12px;
    background: #e96ab2;
    color: white;
    cursor: pointer;
    font-size: 16px;
}

button:disabled {
    opacity: .5;
    cursor: wait;
}

button:hover {
    background: #ff8bc9;
}

.mic {
    margin-top: 10px;
    width: 100%;
    background: #8054b5;
}

footer {
    text-align: center;
    padding: 25px;
    color: #bda8d1;
    font-size: 13px;
}

@media(max-width: 600px) {
    .chat {
        height: 430px;
    }

    #avatar3d {
        height: 340px;
    }
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
    "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.4.2/lib/three-vrm.module.min.js"
  }
}
</script>

</head>

<body>

<header>🌸 ASTRA AI 🌸</header>

<div class="container">

    <section class="character">

        <div id="avatar3d">
            <div id="loading3d">Загружаю Астру... 🌸</div>
        </div>

        <h2>Астра 💗</h2>
        <div class="status">● Готова к общению</div>

    </section>

    <section class="chat">

        <h2>Наш диалог 💬</h2>

        <div class="messages" id="messages">
            <div class="message bot">
                Привет! Я Астра! 🌸 Очень рада знакомству!
                Давай общаться!
            </div>
        </div>

        <div class="controls">
            <input id="input" placeholder="Напиши мне что-нибудь...">
            <button id="sendButton">➤</button>
        </div>

        <button class="mic" id="micButton">🎤 Говорить</button>

    </section>

</div>

<footer>
    Astra AI © 2026 · Твоя виртуальная помощница 🌸
</footer>

<script type="module">

import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { VRMLoaderPlugin } from "@pixiv/three-vrm";

// -----------------------------
// 3D АСТРА
// -----------------------------

const container = document.getElementById("avatar3d");
const loading = document.getElementById("loading3d");

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
    30,
    container.clientWidth / container.clientHeight,
    0.1,
    100
);

camera.position.set(0, 1.35, 3.5);

const renderer = new THREE.WebGLRenderer({
    alpha: true,
    antialias: true
});

renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(
    container.clientWidth,
    container.clientHeight
);

renderer.outputColorSpace = THREE.SRGBColorSpace;

container.appendChild(renderer.domElement);

// Освещение

scene.add(
    new THREE.HemisphereLight(
        0xffffff,
        0x9b6b9b,
        2
    )
);

const light = new THREE.DirectionalLight(
    0xffffff,
    2
);

light.position.set(1, 2, 3);
scene.add(light);

// Загрузка VRM

let currentVrm = null;
let head = null;

const loader = new GLTFLoader();

loader.register(parser => new VRMLoaderPlugin(parser));

loader.load(
    "./1544776736783819498.vrm",

    gltf => {

        currentVrm = gltf.userData.vrm;

        if (!currentVrm) {
            loading.textContent = "Не удалось прочитать VRM.";
            return;
        }

        scene.add(currentVrm.scene);

        // Подбираем положение камеры по размеру модели

        const box = new THREE.Box3().setFromObject(
            currentVrm.scene
        );

        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());

        currentVrm.scene.position.x -= center.x;
        currentVrm.scene.position.y -= box.min.y;
        currentVrm.scene.position.z -= center.z;

        const height = size.y || 1.5;

        camera.position.set(
            0,
            height * 0.72,
            height * 2.5
        );

        camera.lookAt(
            0,
            height * 0.55,
            0
        );

        head = currentVrm.humanoid
            .getNormalizedBoneNode("head");

        loading.style.display = "none";

    },

    progress => {

        if (progress.total > 0) {
            const percent = Math.round(
                progress.loaded / progress.total * 100
            );

            loading.textContent =
                "Загружаю Астру... " + percent + "%";
        }

    },

    error => {

        console.error(error);

        loading.textContent =
            "Не удалось загрузить модель. Проверь файл VRM.";

    }
);

// Поворот головы

let targetX = 0;
let targetY = 0;

container.addEventListener("pointermove", event => {

    const rect = container.getBoundingClientRect();

    targetY = (
        (event.clientX - rect.left) / rect.width - 0.5
    ) * 0.5;

    targetX = (
        (event.clientY - rect.top) / rect.height - 0.5
    ) * 0.2;

});

container.addEventListener("pointerleave", () => {
    targetX = 0;
    targetY = 0;
});

// Анимация

const clock = new THREE.Clock();

function animate() {

    requestAnimationFrame(animate);

    const delta = clock.getDelta();

    if (currentVrm) {

        currentVrm.update(delta);

        if (head) {

            head.rotation.y +=
                (targetY - head.rotation.y) * 0.05;

            head.rotation.x +=
                (targetX - head.rotation.x) * 0.05;

        }

    }

    renderer.render(scene, camera);

}

animate();

// Адаптация под размер экрана

window.addEventListener("resize", () => {

    const width = container.clientWidth;
    const height = container.clientHeight;

    camera.aspect = width / height;
    camera.updateProjectionMatrix();

    renderer.setSize(width, height);

});

// -----------------------------
// ЧАТ С ИСКУССТВЕННЫМ ИНТЕЛЛЕКТОМ
// -----------------------------

const API_URL =
    "https://astra-ai.fotopsh24.workers.dev/chat";

const messages = document.getElementById("messages");
const input = document.getElementById("input");
const sendButton = document.getElementById("sendButton");
const micButton = document.getElementById("micButton");

let history = [];
let isSending = false;

function addMessage(text, type) {

    const div = document.createElement("div");

    div.className = "message " + type;
    div.textContent = text;

    messages.appendChild(div);

    messages.scrollTop = messages.scrollHeight;

}

function speak(text) {

    if (!("speechSynthesis" in window)) return;

    speechSynthesis.cancel();

    const voice = new SpeechSynthesisUtterance(text);

    voice.lang = "ru-RU";
    voice.rate = 1;
    voice.pitch = 1.15;

    speechSynthesis.speak(voice);

}

async function sendMessage() {

    const text = input.value.trim();

    if (!text || isSending) return;

    input.value = "";

    addMessage(text, "user");

    isSending = true;
    sendButton.disabled = true;

    try {

        const response = await fetch(API_URL, {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({

                message: text,
                history: history

            })

        });

        const data = await response.json();

        if (!response.ok || !data.reply) {
            throw new Error(data.error || "Ошибка сервера");
        }

        addMessage(data.reply, "bot");

        speak(data.reply);

        history.push(
            { role: "user", content: text },
            { role: "assistant", content: data.reply }
        );

        history = history.slice(-10);

    } catch (error) {

        console.error(error);

        addMessage(
            "Ой! Не получилось подключиться к моему ИИ. Попробуй ещё раз. 💗",
            "bot"
        );

    } finally {

        isSending = false;
        sendButton.disabled = false;
        input.focus();

    }

}

sendButton.addEventListener("click", sendMessage);

input.addEventListener("keydown", event => {

    if (event.key === "Enter") {
        sendMessage();
    }

});

// -----------------------------
// ГОЛОСОВОЙ ВВОД
// -----------------------------

function listen() {

    const Recognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!Recognition) {

        addMessage(
            "Твой браузер не поддерживает распознавание речи.",
            "bot"
        );

        return;

    }

    const recognition = new Recognition();

    recognition.lang = "ru-RU";

    recognition.onresult = event => {

        input.value = event.results[0][0].transcript;

        sendMessage();

    };

    recognition.onerror = () => {

        addMessage(
            "Не удалось распознать речь. Попробуй ещё раз.",
            "bot"
        );

    };

    recognition.start();

}

micButton.addEventListener("click", listen);

</script>

</body>
</html>
