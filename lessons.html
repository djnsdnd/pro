<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Обучение | SkillDrop Academy</title>
    <style>
        :root {
            --bg-main: #05070c;
            --bg-card: #0d111a;
            --accent: #00f2fe;
            --accent-2: #4facfe;
            --text-main: #ffffff;
            --text-muted: #8e98b0;
            --border: #1a2338;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); line-height: 1.6; }
        header { background: rgba(5, 7, 12, 0.95); padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
        .back-link { color: var(--accent); text-decoration: none; font-weight: 700; font-size: 0.9rem; }
        .container { max-width: 1100px; margin: 30px auto; padding: 0 20px; display: grid; grid-template-columns: 280px 1fr; gap: 20px; }
        @media(max-width:768px) { .container { grid-template-columns: 1fr; } }
        .sidebar { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; }
        .level-btn { display: block; width: 100%; background: var(--bg-main); border: 1px solid var(--border); color: var(--text-muted); padding: 10px; border-radius: 10px; text-align: left; font-weight: 700; cursor: pointer; margin-bottom: 8px; }
        .level-btn.active { background: rgba(0,242,254,0.1); color: var(--accent); border-color: var(--accent); }
        .lessons-list { list-style: none; margin-top: 15px; display: flex; flex-direction: column; gap: 6px; }
        .lesson-li { background: var(--bg-main); border: 1px solid var(--border); padding: 10px 12px; border-radius: 8px; font-size: 0.85rem; color: var(--text-muted); cursor: pointer; }
        .lesson-li.active { color: #fff; border-color: var(--accent-2); background: rgba(79,172,254,0.1); }
        .content-box { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 30px; }
        .prompt-box { background: var(--bg-main); border-left: 3px solid var(--accent); padding: 12px; font-family: monospace; font-size: 0.85rem; border-radius: 6px; margin: 15px 0; }
    </style>
</head>
<body>
    <header>
        <h3 id="courseHeaderTitle" style="color:var(--accent);">Академия</h3>
        <a href="cabinet.html" class="back-link">← В личный кабинет</a>
    </header>

    <div class="container">
        <div class="sidebar">
            <h4 style="margin-bottom: 10px; font-size:0.95rem;">Уровни</h4>
            <button class="level-btn active" onclick="setLevel('beginner')">🟢 Уровень 1: Старт</button>
            <button class="level-btn" onclick="setLevel('pro')">🔴 Уровень 2: PRO</button>
            <h4 style="margin: 20px 0 8px; font-size:0.95rem; color:var(--text-muted);">Уроки:</h4>
            <ul class="lessons-list" id="lessonsUl"></ul>
        </div>
        <div class="content-box">
            <h2 id="lesTitle" style="color:var(--accent); margin-bottom: 15px;">Выберите урок</h2>
            <div id="lesText" style="color:#d1d5db; font-size:0.95rem; line-height: 1.7;">Материалы урока загружаются...</div>
        </div>
    </div>

    <script>
        const dbLessons = {
            ai: {
                beginner: [
                    { title: "Урок 1. Основы ИИ", text: "Разбор базовых понятий токенизации и контекста.", prompt: "Объясни квантовую физику простыми словами." },
                    { title: "Урок 2. Формула промпта", text: "Как правильно ставить роль, задачу и контекст модели.", prompt: "Действуй как маркетолог. Напиши план продвижения." }
                ],
                pro: [
                    { title: "Урок 1. Автономные агенты", text: "Связывание нескольких моделей для автоматических задач.", prompt: "Напиши архитектуру авто-бота." }
                ]
            },
            shorts: {
                beginner: [
                    { title: "Урок 1. Крючок для Shorts", text: "Как удерживать внимание зрителя в первые 2 секунды видео.", prompt: "Сценарий ролика на 15 секунд про желейного монстра." }
                ],
                pro: [
                    { title: "Урок 1. ASMR-монтаж", text: "Тонкости звукового оформления и алгоритмов YouTube.", prompt: "Промпт для генерации ассетов в Kling AI." }
                ]
            }
        };

        const urlParams = new URLSearchParams(window.location.search);
        const courseId = urlParams.get('course') || 'ai';
        let currentLvl = 'beginner';

        document.getElementById('courseHeaderTitle').innerText = courseId === 'shorts' ? '🎬 3D Анимация и Shorts' : '🧠 Мастер ИИ и Промптинг';

        function setLevel(lvl) {
            currentLvl = lvl;
            document.querySelectorAll('.level-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            renderList();
        }

        function renderList() {
            const ul = document.getElementById('lessonsUl');
            ul.innerHTML = '';
            const list = dbLessons[courseId][currentLvl] || [];
            list.forEach((l, idx) => {
                ul.innerHTML += `<li class="lesson-li ${idx===0?'active':''}" onclick="selectLesson(${idx})">${l.title}</li>`;
            });
            if(list.length > 0) selectLesson(0);
        }

        function selectLesson(idx) {
            document.querySelectorAll('.lesson-li').forEach((li, i) => {
                if(i === idx) li.classList.add('active');
                else li.classList.remove('active');
            });
            const l = dbLessons[courseId][currentLvl][idx];
            document.getElementById('lesTitle').innerText = l.title;
            document.getElementById('lesText').innerHTML = `
                <p>${l.text}</p>
                <div class="prompt-box">Шаблон / Промпт:<br><b>${l.prompt}</b></div>
                <p style="margin-top:20px; color:var(--gold);"><b>📌 Задание:</b> Протестируйте этот шаблон и примените на практике.</p>
            `;
        }

        renderList();
    </script>
</body>
</html>
